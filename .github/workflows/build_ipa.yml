name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Native iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Compile Native ARM64 Mach-O Binary
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Compiling with iOS SDK at: $SDK_PATH"
          swift build -c release \
            -Xswiftc "-sdk" -Xswiftc "$SDK_PATH" \
            -Xswiftc "-target" -Xswiftc "arm64-apple-ios16.0"

          mkdir -p Payload/AirGapReceiver.app
          BIN_PATH=$(find .build -type f -name "AirGapReceiver" | grep -v "\.dSYM" | head -n 1)
          echo "Found binary at: $BIN_PATH"
          cp "$BIN_PATH" Payload/AirGapReceiver.app/AirGapReceiver
          cp Info.plist Payload/AirGapReceiver.app/Info.plist
          zip -r AirGapReceiver_compiled.ipa Payload

      - name: Upload Compiled IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirGapReceiver-Native-IPA
          path: AirGapReceiver_compiled.ipa
